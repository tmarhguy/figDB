# Local 3-node FigDB cluster (Commit 20 wires real images).
# Placeholder reserved in Commit 01 so deployment shape is reviewed early.
services:
  node-1:
    image: figdb:local
    command: ["--node-id", "node-1", "--listen", "0.0.0.0:7001"]
    ports: ["7001:7001"]
  node-2:
    image: figdb:local
    command: ["--node-id", "node-2", "--listen", "0.0.0.0:7002"]
    ports: ["7002:7002"]
  node-3:
    image: figdb:local
    command: ["--node-id", "node-3", "--listen", "0.0.0.0:7003"]
    ports: ["7003:7003"]
