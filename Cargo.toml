[workspace]
members = [
    "crates/fig-core",
    "crates/fig-sstable",
    "crates/fig-storage",
    "crates/fig-wal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tmarhguy/fig"
rust-version = "1.75"

[workspace.dependencies]
fig-core = { path = "crates/fig-core" }
fig-sstable = { path = "crates/fig-sstable" }
fig-storage = { path = "crates/fig-storage" }
fig-wal = { path = "crates/fig-wal" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
bytes = "1"
crc32fast = "1.4"
rand = "0.8"
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
