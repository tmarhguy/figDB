syntax = "proto3";

package fig.v1;

// Commit 09 implements this API over tonic/gRPC.
// Commit 01 reserves the surface so later work only fills in behavior.
//
// Keys/values are arbitrary bytes subject to fig-core limits.
service Kv {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
}

message GetRequest { bytes key = 1; string request_id = 2; }
message GetResponse { bytes value = 1; bool found = 2; }
message PutRequest { bytes key = 1; bytes value = 2; string request_id = 3; }
message PutResponse {}
message DeleteRequest { bytes key = 1; string request_id = 2; }
message DeleteResponse {}
message ScanRequest { bytes start_key = 1; bytes end_key = 2; uint32 limit = 3; string request_id = 4; }
message ScanResponse { repeated KvPair pairs = 1; }
message KvPair { bytes key = 1; bytes value = 2; }
