<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-label="Write path diagram">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .label { font-family: sans-serif; font-size: 13px; fill: #111111; text-anchor: middle; }
    .sub { font-family: sans-serif; font-size: 10px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #333333; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="45" width="100" height="60" rx="4"/>
  <text class="label" x="60" y="72">Client</text>
  <text class="sub" x="60" y="88">TCP / JSON</text>
  <rect class="box" x="160" y="45" width="100" height="60" rx="4"/>
  <text class="label" x="210" y="72">WAL</text>
  <text class="sub" x="210" y="88">append + sync</text>
  <rect class="box" x="310" y="45" width="100" height="60" rx="4"/>
  <text class="label" x="360" y="72">Memtable</text>
  <text class="sub" x="360" y="88">ordered map</text>
  <rect class="box" x="460" y="45" width="100" height="60" rx="4"/>
  <text class="label" x="510" y="72">SSTables</text>
  <text class="sub" x="510" y="88">flush + merge</text>
  <line class="arrow" x1="110" y1="75" x2="158" y2="75"/>
  <line class="arrow" x1="260" y1="75" x2="308" y2="75"/>
  <line class="arrow" x1="410" y1="75" x2="458" y2="75"/>
  <text class="sub" x="300" y="130">Generic placeholder diagram. Replace per project; keep the caption style.</text>
</svg>
